services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kyko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kyko}
      POSTGRES_DB: kyko
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyko -d kyko"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kyko:${POSTGRES_PASSWORD:-kyko}@db:5432/kyko
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: '["${FRONTEND_URL:-http://localhost:3000}"]'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}
    volumes:
      - media:/app/media
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_CURRENCY: ${CURRENCY:-₸}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
