# Render Blueprint: one web service (site + API) + free PostgreSQL.
# Dashboard → New → Blueprint → pick this repository/branch → fill ADMIN_EMAIL / ADMIN_PASSWORD.
databases:
  - name: kyko-db
    plan: free
    databaseName: kyko
    user: kyko

services:
  - type: web
    name: kyko-parfums
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kyko-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # No demo products or demo accounts (password123) on the live shop. "true" fills an empty
      # catalog with them, for a test deploy only.
      - key: SEED_DEMO
        value: "false"
      # Telegram bot for new-order messages, made in @BotFather. Empty = no messages; who gets
      # them is set in the admin panel («Настройки» → «Уведомления в Telegram»).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Email for password recovery and order news to customers. Without SMTP_HOST nothing is
      # sent (and «Забыли пароль?» can't work). Gmail / Yandex / Mail.ru: an app password from
      # the mailbox settings; SMTP_FROM must be that mailbox.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Error reports to Sentry (sentry.io → project → Client Keys (DSN)). Empty = none.
      - key: SENTRY_DSN
        sync: false
